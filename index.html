<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Order summary component | solution to the Frontend Mentor challenge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order summary component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <article class="card">
            <div class="card__illustration">
                <img src="./images/illustration-hero.svg" alt="">
            </div>
            <div class="card__main">
                <header>
                    <h1>Order summary</h1>
                    <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
                </header>
                <div class="card__plan">
                    <div class="card__plan-details">
                        <img src="./images/icon-music.svg" alt="">
                        <div class="card__plan-description">
                            <span class="card__plan-type">Annual plan</span>
                            <span class="card__plan-price">$59.99/year</span>
                        </div>
                    </div>
                    <a class="card__plan-change" href="#">Change</a>
                </div>
                <div class="card__actions">
                    <button class="card__proceed-button">Proceed to Payment</button>
                    <button class="card__cancel-button">Cancel order</button>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
